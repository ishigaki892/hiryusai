<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>飛龍祭記録</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fff;
        color: #222;
        font-family:
          -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
        line-height: 1.8;
      }

      header {
        padding: 72px 20px 56px;
        text-align: center;
        border-bottom: 1px solid #ddd;
      }

      header p {
        margin: 0 0 10px;
        color: #777;
        font-size: 14px;
      }

      h1 {
        margin: 0;
        font-size: 32px;
      }

      main {
        width: min(700px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      article {
        padding: 0 0 42px;
        margin-bottom: 42px;
        border-bottom: 1px solid #ddd;
      }

      .date {
        color: #777;
        font-size: 13px;
        margin-bottom: 6px;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 22px;
      }

      p {
        margin: 0 0 12px;
      }

      .image {
        aspect-ratio: 16 / 9;
        margin-bottom: 16px;
        background: #f3f3f3;
        border: 1px solid #ddd;
        display: grid;
        place-items: center;
        color: #999;
        font-size: 13px;
      }

      footer {
        padding: 32px 20px;
        text-align: center;
        color: #888;
        font-size: 13px;
      }

      @media (max-width: 500px) {
        header {
          padding: 52px 20px 40px;
        }

        h1 {
          font-size: 27px;
        }

        main {
          padding: 36px 0;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <p>2026 3-1</p>
      <h1>飛龍祭 制作日記</h1>
    </header>

    <main>
      <article>
        <div class="date">サンプル</div>
        <h2>サンプル</h2>
        <div class="image">サンプル</div>
        <p>aaaaaaaaaaaaaaaaaaaaaa</p>
      </article>
    </main>

    <footer>飛龍祭 2026<br />made by Ishigaki</footer>
  </body>
</html>
